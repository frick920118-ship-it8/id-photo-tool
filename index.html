<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>证件照换底色</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f7;--surface:#fff;--border:#e5e5e7;--text:#1d1d1f;--text2:#86868b;--blue:#0071e3;--red:#e53e3e;--radius:12px;--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:16px}
.header{text-align:center;padding:32px 0 20px}
.header h1{font-size:26px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.header p{font-size:14px;color:var(--text2)}
.upload-zone{background:var(--surface);border:2px dashed var(--border);border-radius:var(--radius);padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:16px;position:relative;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.upload-zone:hover,.upload-zone.drag{border-color:var(--blue);background:#f0f7ff}
.upload-zone.has-image{border-style:solid;padding:0;cursor:default;min-height:auto}
.upload-zone.has-image:hover{border-color:var(--border);background:var(--surface)}
.upload-icon{font-size:48px;margin-bottom:12px;opacity:.6}
.upload-text{font-size:15px;font-weight:500;margin-bottom:4px}
.upload-hint{font-size:12px;color:var(--text2)}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.preview-wrap{position:relative;width:100%}
.preview-wrap canvas{display:block;width:100%;border-radius:8px}
.color-picker{display:flex;gap:8px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.color-btn{width:48px;height:48px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all .15s}
.color-btn:hover{transform:scale(1.08)}
.color-btn.active{border-color:var(--text);box-shadow:0 0 0 2px var(--surface),0 0 0 5px var(--text)}
.color-btn.red{background:#d63031}.color-btn.blue{background:#0984e3}
.color-btn.white{background:#fff;border:3px solid #ddd}
.color-btn.white.active{border-color:var(--text)}
.color-label{font-size:11px;color:var(--text2);text-align:center;margin-top:4px}
.tolerance-slider{margin:16px 0}
.tolerance-slider label{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:6px}
.tolerance-slider input[type=range]{width:100%;accent-color:var(--blue)}
.actions{display:flex;gap:10px;margin:16px 0}
.btn{flex:1;padding:13px 16px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;font-family:var(--font);text-align:center;text-decoration:none}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#0077ed}
.btn-secondary{background:#e8e8ed;color:var(--text)}.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.paywall{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:var(--radius);padding:20px;text-align:center;margin:16px 0}
.paywall h3{font-size:18px;margin-bottom:6px}.paywall p{font-size:13px;opacity:.9;margin-bottom:14px}
.paywall .price{font-size:32px;font-weight:700;margin:8px 0}
.paywall .price small{font-size:14px;font-weight:400;opacity:.8}
.pay-btn{display:inline-block;background:#fff;color:#764ba2;padding:12px 32px;border-radius:25px;font-size:15px;font-weight:700;text-decoration:none;transition:transform .15s;margin-top:8px}
.pay-btn:hover{transform:scale(1.04)}
.qrcode{width:160px;height:160px;background:#fff;border-radius:12px;margin:12px auto;padding:8px}
.qrcode img{width:100%;height:100%;object-fit:contain}
.hidden{display:none!important}.mt-8{margin-top:8px}.text-center{text-align:center}.text-sm{font-size:12px;color:var(--text2)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="app">
  <div class="header"><h1>证件照换底色</h1><p>上传照片，一键更换背景色 · 纯浏览器处理</p></div>
  <div class="upload-zone" id="uz">
    <div class="upload-icon" id="ui">📷</div>
    <div class="upload-text" id="ut">点击或拖拽上传照片</div>
    <div class="upload-hint">支持 JPG、PNG、WebP</div>
    <input type="file" id="fi" accept="image/*">
  </div>
  <div class="preview-wrap hidden" id="pw"><canvas id="pc"></canvas></div>
  <div id="ct" class="hidden">
    <div class="color-picker">
      <div><button class="color-btn red active" data-c="#d63031" onclick="sc(this,'#d63031')"></button><div class="color-label">红色</div></div>
      <div><button class="color-btn blue" data-c="#0984e3" onclick="sc(this,'#0984e3')"></button><div class="color-label">蓝色</div></div>
      <div><button class="color-btn white" data-c="#ffffff" onclick="sc(this,'#ffffff')"></button><div class="color-label">白色</div></div>
    </div>
    <div class="tolerance-slider"><label><span>边缘容差</span><span id="tv">30</span></label><input type="range" id="tr" min="5" max="100" value="30" oninput="ot()"></div>
    <div class="actions"><button class="btn btn-outline" onclick="ri()">重新选择</button><button class="btn btn-primary" onclick="pd()">⬇ 下载预览图</button></div>
    <div class="paywall" id="pl">
      <h3>🎯 下载高清原图</h3><p>预览图有水印，高清原图只需</p><div class="price">¥5.9 <small>/ 次</small></div>
      <p class="text-sm mt-8">微信扫码支付后自动解锁</p>
      <div class="qrcode" id="qw"><img src="qrcode.jpg" alt="微信收款码" id="qi"></div>
      <a href="#" class="pay-btn" id="pb" onclick="sq(event)">立即解锁高清下载</a>
      <button class="btn btn-primary hidden mt-8" id="ub" style="display:block;width:100%;max-width:200px;margin:12px auto 0">我已支付，解锁下载</button>
    </div>
  </div>
</div>
<div class="toast" id="to"></div>
<script>
let oi=null,bg="#d63031",tl=30,pd2=false;
const uz=document.getElementById("uz"),fi=document.getElementById("fi"),pw=document.getElementById("pw"),pc=document.getElementById("pc"),ct=document.getElementById("ct"),pl=document.getElementById("pl"),pb=document.getElementById("pb"),ub=document.getElementById("ub"),ui=document.getElementById("ui"),ut=document.getElementById("ut");
uz.addEventListener("click",e=>{if(e.target!==fi&&!oi)fi.click()});
uz.addEventListener("dragover",e=>{e.preventDefault();uz.classList.add("drag")});
uz.addEventListener("dragleave",()=>uz.classList.remove("drag"));
uz.addEventListener("drop",e=>{e.preventDefault();uz.classList.remove("drag");let f=e.dataTransfer.files[0];if(f)hf(f)});
fi.addEventListener("change",e=>{if(e.target.files[0])hf(e.target.files[0])});
function hf(f){if(!f.type.startsWith("image/")){to("请上传图片文件");return}if(f.size>20*1024*1024){to("文件太大");return}let r=new FileReader();r.onload=e=>{let i=new Image();i.onload=()=>{oi=i;uz.classList.add("has-image");ui.style.display="none";ut.textContent="点击更换照片";pw.classList.remove("hidden");ct.classList.remove("hidden");pi()};i.src=e.target.result};r.readAsDataURL(f)}
function sc(b,c){document.querySelectorAll(".color-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");bg=c;pi()}
function ot(){tl=parseInt(document.getElementById("tr").value);document.getElementById("tv").textContent=tl;pi()}
function pi(){if(!oi)return;let c=pc,mw=500,s=Math.min(mw/oi.width,1);c.width=Math.round(oi.width*s);c.height=Math.round(oi.height*s);let ctx=c.getContext("2d");ctx.drawImage(oi,0,0,c.width,c.height);let id=ctx.getImageData(0,0,c.width,c.height),d=id.data,sw=c.width,sh=c.height,samples=[];for(let x=0;x<sw;x+=10)for(let y of[0,sh-1]){let i=(y*sw+x)*4;samples.push([d[i],d[i+1],d[i+2]])}for(let y=0;y<sh;y+=10)for(let x of[0,sw-1]){let i=(y*sw+x)*4;samples.push([d[i],d[i+1],d[i+2]])}let sr=0,sg=0,sb=0;for(let s of samples){sr+=s[0];sg+=s[1];sb+=s[2]}sr=Math.round(sr/samples.length);sg=Math.round(sg/samples.length);sb=Math.round(sb/samples.length);let tr=parseInt(bg.slice(1,3),16),tg=parseInt(bg.slice(3,5),16),tb=parseInt(bg.slice(5,7),16);for(let i=0;i<d.length;i+=4){let dr=Math.abs(d[i]-sr),dg=Math.abs(d[i+1]-sg),db=Math.abs(d[i+2]-sb),dist=dr+dg+db;if(dist<tl*3){let a=Math.min(dist/(tl*3),1);d[i]=Math.round(d[i]*a+tr*(1-a));d[i+1]=Math.round(d[i+1]*a+tg*(1-a));d[i+2]=Math.round(d[i+2]*a+tb*(1-a))}}ctx.putImageData(id,0,0)}
function pd(){let c=document.createElement("canvas");c.width=pc.width;c.height=pc.height;let ctx=c.getContext("2d");ctx.drawImage(pc,0,0);ctx.fillStyle="rgba(255,255,255,0.6)";ctx.font=c.width*0.05+"px sans-serif";ctx.fillText("预览图 · 有水印",c.width*0.1,c.height*0.9);let a=document.createElement("a");a.download="证件照_预览.png";a.href=c.toDataURL("image/png");a.click();to("预览图已下载，支付¥5.9解锁高清")}
function sq(e){e.preventDefault();document.getElementById("qw").classList.remove("hidden");pb.classList.add("hidden");ub.classList.remove("hidden");to("请用微信扫码支付 ¥5.9")}
ub.addEventListener("click",()=>{pd2=true;pl.classList.add("hidden");to("已解锁！");let ad=document.querySelector(".actions");ad.innerHTML='<button class="btn btn-outline" onclick="ri()">重新选择</button><button class="btn btn-primary" onclick="dh()">⬇ 下载高清原图</button>'});
function dh(){if(!pd2){pd();return}let c=document.createElement("canvas");c.width=oi.width;c.height=oi.height;let ctx=c.getContext("2d");ctx.drawImage(oi,0,0);let id=ctx.getImageData(0,0,c.width,c.height),d=id.data,sw=c.width,sh=c.height,samples=[];for(let x=0;x<sw;x+=Math.max(1,Math.floor(sw/50)))for(let y of[0,sh-1]){let i=(y*sw+x)*4;samples.push([d[i],d[i+1],d[i+2]])}for(let y=0;y<sh;y+=Math.max(1,Math.floor(sh/50)))for(let x of[0,sw-1]){let i=(y*sw+x)*4;samples.push([d[i],d[i+1],d[i+2]])}let sr=0,sg=0,sb=0;for(let s of samples){sr+=s[0];sg+=s[1];sb+=s[2]}sr=Math.round(sr/samples.length);sg=Math.round(sg/samples.length);sb=Math.round(sb/samples.length);let tr=parseInt(bg.slice(1,3),16),tg=parseInt(bg.slice(3,5),16),tb=parseInt(bg.slice(5,7),16);for(let i=0;i<d.length;i+=4){let dr=Math.abs(d[i]-sr),dg=Math.abs(d[i+1]-sg),db=Math.abs(d[i+2]-sb),dist=dr+dg+db;if(dist<tl*3){let a=Math.min(dist/(tl*3),1);d[i]=Math.round(d[i]*a+tr*(1-a));d[i+1]=Math.round(d[i+1]*a+tg*(1-a));d[i+2]=Math.round(d[i+2]*a+tb*(1-a))}}ctx.putImageData(id,0,0);let lb=["红底","蓝底","白底"][["#d63031","#0984e3","#ffffff"].indexOf(bg)]||"";let a=document.createElement("a");a.download="证件照_"+lb+".png";a.href=c.toDataURL("image/png");a.click();to("高清原图下载完成！")}
function ri(){oi=null;pd2=false;pw.classList.add("hidden");ct.classList.add("hidden");uz.classList.remove("has-image");ui.style.display="";ut.textContent="点击或拖拽上传照片";pl.classList.remove("hidden");pb.classList.remove("hidden");ub.classList.add("hidden");document.getElementById("qw").classList.add("hidden");document.getElementById("tr").value=30;tl=30;document.getElementById("tv").textContent="30";document.querySelectorAll(".color-btn").forEach((b,i)=>{b.classList.toggle("active",i===0)});bg="#d63031";document.querySelector(".actions").innerHTML='<button class="btn btn-outline" onclick="ri()">重新选择</button><button class="btn btn-primary" onclick="pd()">⬇ 下载预览图</button>';fi.value=""}
function to(m){let t=document.getElementById("to");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2000)}
</script>
</body>
</html>
